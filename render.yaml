services:
  - type: web
    name: attendflow-demo
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: off
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attendflow-demo-db
          property: connectionString
      - key: ATTENDFLOW_DEMO_PASSWORD
        sync: false
      - key: ATTENDFLOW_DEPLOYED
        value: "true"
      - key: ATTENDFLOW_ENABLE_SEED
        value: "false"
      - key: ATTENDFLOW_DEMO_MODE
        value: "false"
      - key: ATTENDFLOW_DEMO_RESET_ENABLED
        value: "false"
      - key: ATTENDFLOW_DEMO_EXTRA_WEEK
        value: "false"
      - key: LLM_DIAGNOSTICS
        value: "off"
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: SCHEDULER_INTERVAL_SECONDS
        value: "60"
      - key: SCHEDULER_INVESTIGATIONS_PER_CYCLE
        value: "1"
      - key: SCHEDULER_MESSAGES_PER_CYCLE
        value: "1"
      - key: SCHEDULER_BACKLOG
        value: "false"

databases:
  - name: attendflow-demo-db
    region: oregon
    plan: free
    version: "16"
    ipAllowList: []
