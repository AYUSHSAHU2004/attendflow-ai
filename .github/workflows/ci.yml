name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendflow
          POSTGRES_PASSWORD: attendflow
          POSTGRES_DB: attendflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U attendflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://attendflow:attendflow@localhost:5433/attendflow_test
      REQUIRE_DB: "1"  # API tests must run in CI, never be skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Validate demo data and policy files
        run: uv run attendflow-validate
      - name: README autonomy table matches the registry
        run: uv run attendflow-autonomy --check
      - name: Tests (engine + API on PostgreSQL)
        run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and verification
        working-directory: frontend
        run: |
          npm ci
          npm run api:check
          npm run typecheck
          npm test
          npm run build

  image:
    name: Build and push the image (main only)
    # Only after every check above passed, and only for pushes to main (never for PRs).
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (ghcr.io needs lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/attendflow-ai" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
