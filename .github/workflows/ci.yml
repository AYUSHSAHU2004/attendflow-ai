name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: attendflow
          POSTGRES_PASSWORD: attendflow
          POSTGRES_DB: attendflow_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U attendflow"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+psycopg://attendflow:attendflow@localhost:5433/attendflow_test
      REQUIRE_DB: "1"  # API tests must run in CI, never be skipped
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Validate demo data and policy files
        run: uv run attendflow-validate
      - name: README autonomy table matches the registry
        run: uv run attendflow-autonomy --check
      - name: Tests (engine + API on PostgreSQL)
        run: uv run pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install and verification
        working-directory: frontend
        run: |
          npm ci
          npm run api:check
          npm run typecheck
          npm test
          npm run build
