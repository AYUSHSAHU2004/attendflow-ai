# PostgreSQL 16 for the demo: one pod, 2Gi on the k3s local-path volume, reachable only
# from the app (see networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: attendflow-db
  labels:
    app.kubernetes.io/name: attendflow
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: attendflow
    app.kubernetes.io/component: database
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: attendflow-db
  labels:
    app.kubernetes.io/name: attendflow
    app.kubernetes.io/component: database
spec:
  serviceName: attendflow-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attendflow
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attendflow
        app.kubernetes.io/component: database
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-bookworm
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: attendflow
            - name: POSTGRES_DB
              value: attendflow
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attendflow-secrets
                  key: POSTGRES_PASSWORD
            # A subfolder, so the volume root may hold other files.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "attendflow", "-d", "attendflow"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "attendflow", "-d", "attendflow"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
