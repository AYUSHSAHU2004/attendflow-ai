# Local PostgreSQL for development and tests:  docker compose up -d db
# The app itself runs on the host in this phase (a backend container comes in Phase 22).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: attendflow
      POSTGRES_PASSWORD: attendflow   # local dev only, not a secret
      POSTGRES_DB: attendflow
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"   # 5433 on the host: a local PostgreSQL service may already use 5432
    volumes:
      - attendflow-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendflow -d attendflow"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  attendflow-db:
