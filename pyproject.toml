[project]
name = "attendflow"
version = "0.1.0"
description = "AttendFlow AI: an agent that finds and fixes timecard exceptions before payroll."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.165.0",
    "openai>=1.50",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
attendflow-generate-data = "attendflow.scripts.generate_data:main"
attendflow-validate = "attendflow.scripts.validate_data:main"
attendflow-llm-test = "attendflow.scripts.llm_smoke_test:main"
attendflow-detect = "attendflow.scripts.detect:main"
attendflow-api = "attendflow.api.app:main"
attendflow-tools = "attendflow.scripts.tools_cli:main"
attendflow-agent-smoke = "attendflow.scripts.agent_smoke:main"
attendflow-autonomy = "attendflow.scripts.autonomy_cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/attendflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["attendflow", "tests"]
